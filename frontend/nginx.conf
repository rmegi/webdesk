server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        try_files $uri /index.html;
    }

    # Signaling. The page opens this against its own origin, so it arrives here
    # and has to be handed to the backend as an upgraded connection. Video and
    # input never come this way: they go peer-to-peer over WebRTC.
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # A session stays open for as long as someone is using the desktop.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
